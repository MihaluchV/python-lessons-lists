<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Списки в Python — відео-урок</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f8;--panel:#fff;--ink:#16202c;--mut:#5b6b7c;--blue:#3776ab;--yel:#ffd43b;--cell:#dcebf8;--line:#c9d6e3;--con:#101820;--con-t:#b6f2c0;--err:#ff7b72;--str:#2a7f3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--panel:#17212c;--ink:#e8eef5;--mut:#93a3b5;--blue:#6aa9e0;--cell:#1f3a55;--line:#2b3a4a;--str:#7fd18f}}
:root[data-theme="dark"]{--bg:#0e141b;--panel:#17212c;--ink:#e8eef5;--mut:#93a3b5;--blue:#6aa9e0;--cell:#1f3a55;--line:#2b3a4a;--str:#7fd18f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Onest,system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:auto;padding:14px}
h1{margin:0 0 8px;font-weight:800;font-size:26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.top h1{margin:0}
#nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#nav button{font:600 13px Onest,sans-serif;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer}
#nav button.on{background:var(--yel);color:#16202c;border-color:#c79a00}
.stage{display:grid;grid-template-columns:1fr 1.25fr;gap:12px}
@media(max-width:760px){.stage{grid-template-columns:1fr}}
.p{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
#code{margin:0;font:400 14.5px/1.9 "JetBrains Mono",ui-monospace,monospace}
.ln{display:block;padding:0 8px 0 26px;border-radius:6px;position:relative;white-space:pre-wrap;transition:background .3s;min-height:27px}
.ln.on{background:rgba(255,212,59,.38)}
.ln.on::before{content:"▶";position:absolute;left:7px;color:#c79a00;font-size:12px}
.s{color:var(--str);font-style:normal}.c{color:var(--mut);font-style:normal}
.m{font-style:normal;border-radius:4px;padding:0 2px}
.ln.on .m{color:#e0523f;font-weight:700}
#code.exp .ln.on .m{animation:mc .9s ease-in-out infinite}
@keyframes mc{0%,100%{background:transparent;color:#e0523f}50%{background:#e0523f;color:#fff}}
.ln u{text-decoration:none;position:relative}
#code.s-pe .ln.on u.pe,#code.s-pe2 .ln.on u.pe2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:var(--blue);text-decoration-color:var(--blue);font-weight:700}
#code.s-pf .ln.on u.pf{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:var(--str);text-decoration-color:var(--str);font-weight:700}
#code.s-pc .ln.on u.pc{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:#c47a00;text-decoration-color:#c47a00;font-weight:700}
#code.exp .ln.on u.ai,#code.exp .ln.on u.av{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
#code.exp .ln.on u.ai{color:var(--blue);text-decoration-color:var(--blue)}
#code.exp .ln.on u.av{color:var(--str);text-decoration-color:var(--str)}
#code.exp .ln.on u::after{position:absolute;left:50%;transform:translateX(-50%);top:19px;font:700 10px/1 Onest,sans-serif;white-space:nowrap}
#code.exp .ln.on u.ai::after{content:"індекс";color:var(--blue)}
#code.exp .ln.on u.av::after{content:"значення";color:var(--str)}
#nm,#nm2{font:700 17px "JetBrains Mono",monospace;color:var(--blue);min-height:26px;margin-bottom:6px}
#wrap{position:relative;min-height:190px;overflow-x:auto;overflow-y:hidden;padding-bottom:70px}
#row,#row2{display:flex;position:relative;width:max-content;min-height:100px}
.cell{width:104px;flex:none;text-align:center;overflow:hidden;padding-top:6px;transition:width .55s,opacity .55s,transform .6s}
.cell b{display:block;width:92px;height:64px;margin:0 auto;border:2px solid var(--blue);border-radius:12px;background:var(--cell);font:700 16px/60px "JetBrains Mono",monospace;transition:background .3s,transform .3s}
.cell i{display:block;font:700 15px "JetBrains Mono",monospace;color:var(--blue);margin-top:6px;font-style:normal}
.cell u{display:none;text-decoration:none;font:700 13px "JetBrains Mono",monospace;color:#d1453b}
#row.neg .cell u{display:block}
.noidx .cell i{visibility:hidden}
.cell.hl b{background:var(--yel);transform:scale(1.1);color:#16202c;border-color:#c79a00}
.cell.dim{opacity:.28}
.cell:not(.cage){width:132px}
.cell:not(.cage) b{width:120px}
.narrow .cell:not(.cage):not(.gone){width:88px}
.narrow .cell:not(.cage) b{width:76px}
.cell.cage b{position:relative;background:#e8f0da;border-color:#566070;font:400 38px/58px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.cell.cage.hl b{background:var(--yel);border-color:#c79a00}
.cage b::after,.fly.cage::after{content:"";position:absolute;inset:0;border-radius:9px;background:repeating-linear-gradient(90deg,#4a5360 0 3px,transparent 3px 15px);box-shadow:inset 0 5px 0 #4a5360,inset 0 -5px 0 #4a5360;pointer-events:none}
.fly.cage{font:400 38px/58px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;background:#e8f0da;border-color:#566070}
.cell s{display:block;text-decoration:none;font:600 12px Onest,sans-serif;color:var(--mut);margin-top:3px}
.cell.gone{width:0;opacity:0}
#arr{position:absolute;top:118px;left:0;transform:translateX(-50%);text-align:center;transition:left .5s,opacity .3s;opacity:0;pointer-events:none}
#arr.on{opacity:1}
#arr span{display:block;font-size:24px;line-height:1;color:#e0a800}
#arr em{font:700 14px "JetBrains Mono",monospace;background:var(--yel);color:#16202c;padding:2px 9px;border-radius:6px;white-space:nowrap;font-style:normal}
#fm{display:flex;align-items:flex-start;font:700 22px "JetBrains Mono",monospace;margin:0 0 10px;padding:10px 16px;background:var(--panel);border:2px solid var(--blue);border-radius:12px;width:max-content;max-width:100%;animation:pop .4s}
#fm .pt{display:flex;flex-direction:column;align-items:center;margin:0 6px}
#fm .pt i{font-style:normal;font-size:22px;line-height:1.1}
#fm .pt u{text-decoration:none;font:600 13px Onest,sans-serif;white-space:nowrap}
#fm .fr{display:flex;flex-wrap:wrap;align-items:flex-start;font-size:16px;margin-bottom:8px}
#fm[hidden],#vars[hidden]{display:none}
.c1{color:var(--blue)}.c2{color:var(--str)}.c3{color:#c47a00}
#wrap2{overflow-x:auto;overflow-y:hidden;margin-bottom:10px}
#vars{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}
#vars span{font:700 18px "JetBrains Mono",monospace;padding:6px 14px;border-radius:10px;background:var(--cell);border:2px solid var(--blue);color:var(--ink);animation:pop .4s}
.fly{position:fixed;z-index:6;margin:0;border:2px solid #c79a00;border-radius:12px;background:var(--yel);color:#16202c;font:700 16px/60px "JetBrains Mono",monospace;text-align:center;transition:left 1s ease,top 1s ease;pointer-events:none}
#out{background:var(--con);color:var(--con-t);font:15px/1.6 "JetBrains Mono",monospace;border-radius:10px;padding:10px 14px;min-height:104px;margin:12px 0 0;white-space:pre-wrap}
#out div{animation:pop .4s}#out .e{color:var(--err)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
#sub{margin:12px 0;padding:14px 18px;background:var(--panel);border-left:6px solid var(--yel);border-radius:10px;font-size:19px;line-height:1.45;min-height:92px}
#warn{margin:0 0 10px;padding:8px 12px;border-radius:8px;background:#fff3cd;color:#5c4400;font-size:14px}
#ctl{display:flex;gap:8px;flex-wrap:wrap}
#ctl button,.big,#bend{font:600 15px Onest,sans-serif;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
#bp{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
#start,#end{position:fixed;inset:0;background:rgba(14,20,27,.82);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:5;color:#fff;text-align:center;padding:20px}
#start h2,#end h2{margin:0;font-size:30px;font-weight:800}
.eb{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big:disabled{opacity:.45;cursor:not-allowed}
#start{background:radial-gradient(circle at 25% 15%,#24476b 0,#0e141b 65%)}
.spl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:6px 0 10px}
.spl b{position:relative;display:block;width:76px;height:76px;border:3px solid #566070;border-radius:14px;background:#e8f0da;font:400 38px/70px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;text-align:center;animation:bob 3s ease-in-out infinite}
.spl b::after{content:"";position:absolute;inset:0;border-radius:11px;background:repeating-linear-gradient(90deg,#4a5360 0 3px,transparent 3px 14px);box-shadow:inset 0 5px 0 #4a5360,inset 0 -5px 0 #4a5360}
.spl b:nth-child(2n){animation-delay:.5s}.spl b:nth-child(3n){animation-delay:1s}
@keyframes bob{50%{transform:translateY(-8px)}}
.big{background:var(--yel);color:#16202c;border:0;font-size:19px;padding:13px 28px}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
.splimg{max-width:min(92vw,980px);max-height:50vh;width:auto;height:auto;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.cap{font-size:14px;color:#c4d3e3}
#start{overflow:auto;justify-content:flex-start;padding-top:20px}
#task{background:var(--panel);border:2px solid var(--blue);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:14px;line-height:1.45;animation:pop .4s}
#task[hidden]{display:none}
#task b{display:block;font-size:16px;margin-bottom:4px;color:var(--blue)}
#task u{text-decoration:none;font-weight:700;color:var(--blue)}
.tight .cell:not(.cage):not(.gone){width:66px}
.tight .cell:not(.cage) b{width:56px;font-size:14px}
.words .cell:not(.cage):not(.gone){width:92px}
.words .cell:not(.cage) b{width:84px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Списки в Python</h1><button id="bend">✔ Завершити урок</button></div>
<div id="nav"></div>
<div id="warn" hidden>Український голос у цьому браузері не знайдено — урок піде із субтитрами. Для озвучки відкрийте сторінку в Chrome, Edge або Safari з українською мовою синтезу мовлення.</div>
<main class="stage">
<section class="p"><pre id="code"></pre><pre id="out"></pre></section>
<section class="p"><div id="task" hidden></div><div id="nm"></div><div id="wrap"><div id="row" class="noidx"></div><div id="arr"><span>▲</span><em></em></div></div><div id="vars" hidden></div><div id="fm" hidden></div><div id="blk2" hidden><div id="nm2"></div><div id="wrap2"><div id="row2" class="noidx"></div></div></div></section>
</main>
<div id="sub">Натисніть «Почати урок».</div>
<div id="ctl"><button id="bp">▶ Пуск</button><button id="bprev">⏮ Назад</button><button id="bnext">Далі ⏭</button><button id="brep">↻ Повторити блок</button><button id="bfull">↩ Повернутися на початок уроку</button><button id="bm">🔊 Озвучка</button></div>

<script>
const $=s=>document.querySelector(s),row1=$('#row'),row2=$('#row2'),arr=$('#arr'),out=$('#out'),sub=$('#sub');let row=row1;
let gen=0,pos=0,acted=-1,token=0,muted=false,playing=false,voice=null;
const sleep=ms=>{const g=gen;return new Promise((r,j)=>setTimeout(()=>g===gen?r():j('abort'),ms))};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const cells=()=>[...row.children].filter(c=>!c.classList.contains('gone'));
function idx(){cells().forEach((c,i,a)=>{c.querySelector('i').textContent=i;c.querySelector('u').textContent=i-a.length})}
const AN={'лев':'🦁','слон':'🐘','зебра':'🦓','жираф':'🦒','мавпа':'🐵','тигр':'🐯'};
function mk(v){const c=document.createElement('div'),a=AN[v];c.className='cell'+(a?' cage':'');c.dataset.v=v;c.innerHTML='<b>'+(a||esc(v))+'</b>'+(a?'<s>'+v+'</s>':'')+'<i></i><u></u>';return c}
function reset(n,ix){row=row1;row1.innerHTML='';row2.innerHTML='';row1.className=row2.className=ix?'':'noidx';$('#blk2').hidden=true;sv([]);fm(0);tk(0);document.querySelectorAll('.fly').forEach(e=>e.remove());arr.classList.remove('on');out.innerHTML='';$('#nm').textContent=n?'список '+n:''}
async function build(vals,ms=300){for(const v of vals){const c=mk(v);c.classList.add('gone');row.append(c);c.offsetWidth;c.classList.remove('gone');idx();await sleep(ms)}}
async function ins(i,v){const c=mk(v),cs=cells();c.classList.add('gone');row.insertBefore(c,cs[i]||null);c.offsetWidth;c.classList.remove('gone');idx();c.classList.add('hl');await sleep(1000);c.classList.remove('hl')}
async function del(i){const c=cells()[i];c.classList.add('hl');await sleep(600);c.classList.add('gone');idx();await sleep(700);c.remove()}
async function setv(i,v){const b=cells()[i].querySelector('b');b.style.transform='rotateX(90deg)';await sleep(350);b.textContent=v;b.style.transform='';await sleep(500)}
async function rep(i,v){const c=cells()[i];c.querySelector('b').style.transform='rotateX(90deg)';await sleep(350);const n=mk(v);c.replaceWith(n);idx();n.classList.add('hl');await sleep(800);n.classList.remove('hl')}
async function reorder(ord){const cs=cells(),old=cs.map(c=>c.offsetLeft);ord.forEach(i=>row.appendChild(cs[i]));cs.forEach(c=>{const k=cs.indexOf(c);c.style.transition='none';c.style.transform='translateX('+(old[k]-c.offsetLeft)+'px)'});row.offsetWidth;cs.forEach(c=>{c.style.transition='transform .9s';c.style.transform=''});idx();await sleep(1000);cs.forEach(c=>c.style.transition='')}
async function move(i,R,j,keep){const S0=row,c=cells()[i],b=c.querySelector('b'),v=c.dataset.v,r=b.getBoundingClientRect(),k=document.createElement('div');k.className='fly'+(AN[v]?' cage':'');k.textContent=b.textContent;Object.assign(k.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.append(k);if(!keep)c.classList.add('gone');idx();row=R;const n=mk(v);n.classList.add('gone');n.querySelector('b').style.visibility='hidden';R.insertBefore(n,cells()[j]||null);n.offsetWidth;n.classList.remove('gone');idx();row=S0;await sleep(700);const t=n.querySelector('b').getBoundingClientRect();k.style.left=t.left+'px';k.style.top=t.top+'px';await sleep(1100);n.querySelector('b').style.visibility='';k.remove();if(!keep)c.remove();row=R;idx();row=S0;n.classList.add('hl');await sleep(700);n.classList.remove('hl')}
function hi(l){cells().forEach((c,k)=>c.classList.toggle('hl',l.includes(k)))}
function dim(l){cells().forEach((c,k)=>c.classList.toggle('dim',!!l&&!l.includes(k)))}
function at(i,l){if(i==null){arr.classList.remove('on');return}const cs=cells(),n=cs.length;let x;if(i<n)x=cs[i].offsetLeft+cs[i].offsetWidth/2;else{const z=cs[n-1];x=z.offsetLeft+z.offsetWidth+70}arr.style.left=x+'px';arr.style.top=(cs[0].offsetTop+cs[0].offsetHeight+4)+'px';arr.querySelector('em').textContent=l||'';arr.classList.add('on')}
const cmp=s=>s.replace(/\[([^\[\]]+) for ([^\[\]]+)\]/,(m,a,b)=>{const e=a.match(/^(.+?) if (.+?) else (.+)$/),f=b.match(/^(.+?) if (.+)$/);return '['+(e?'<u class=pe>'+e[1]+'</u> <u class=pc>if '+e[2]+'</u> <u class=pe2>else '+e[3]+'</u>':'<u class=pe>'+a+'</u>')+' <u class=pf>for '+(f?f[1]+'</u> <u class=pc>if '+f[2]:b)+'</u>]'});
const syn=l=>cmp(esc(l)).replace(/\.insert\(([^,]+), ([^)]*)\)/,'.insert(<u class=ai>$1</u>, <u class=av>$2</u>)').replace(/(#.*$)/,'<i class=c>$1</i>').replace(/("[^"]*")/g,'<i class=s>$1</i>').replace(/\.(append|insert|remove|pop|reverse|sort|index|copy|extend|count|split|join)\(/g,'.<i class=m>$1</i>(').replace(/\b(len|del|min|max|sum|list|range|randint|sample|map|int|input|sorted)\b/g,'<i class=m>$1</i>').replace(/ (in) /g,' <i class=m>$1</i> ');
function code(L){$('#code').innerHTML=L.map(l=>'<span class=ln>'+syn(l)+'</span>').join('')}
function ln(n){document.querySelectorAll('.ln').forEach((e,k)=>e.classList.toggle('on',k===n))}
function fm(n){if(Array.isArray(n)){fx(n);return}const e=$('#fm');e.style.flexDirection='';e.hidden=!n;if(!n){e.innerHTML='';return}const P=(c,w,l)=>'<span class="pt '+c+'">'+w+'<i>↓</i><u>'+l+'</u></span>';e.innerHTML='<span>list[</span>'+P('c1','старт','починати з')+'<span>:</span>'+P('c2','стоп','перебирати до')+(n>2?'<span>:</span>'+P('c3','крок','ціле число'):'')+'<span>]</span>'}
function sv(a){const v=$('#vars');v.hidden=!(a&&a.length);v.innerHTML=a&&a.length?a.map(x=>'<span>'+esc(x)+'</span>').join(''):''}
function o(t,e){out.insertAdjacentHTML('beforeend','<div'+(e?' class=e':'')+'>'+esc(t)+'</div>')}

const F=['"яблуко"','"банан"','"вишня"'],FC='fruits = ["яблуко", "банан", "вишня"]';
const N3=['10','20','30'],NUM5=['10','20','30','40','50'];
let S=[],titles=[],starts=[];const LS=[];let li=0;
function sc(title,steps){titles.push(title);starts.push(S.length);steps.forEach(s=>{s.si=titles.length-1;S.push(s)})}

sc('Що таке список',[
{t:'Привіт! Сьогодні ми вивчаємо списки в Python. Список, англійською — list, це впорядкований набір елементів, які зберігаються під одним іменем.',a:async()=>{reset('',false);code([FC,'print(fruits)'])}},
{t:'Ось список з іменем fruits. Його записують у квадратних дужках, а елементи розділяють комами.',a:async()=>{ln(0);$('#nm').textContent='список fruits';await build(F)}},
{t:'Кожне значення в списку називається елементом. Тут їх три: яблуко, банан і вишня.',a:async()=>{for(let k=0;k<3;k++){hi([k]);await sleep(800)}hi([])}},
{t:'Функція print виводить увесь список на екран.',a:async()=>{ln(1);o("['яблуко', 'банан', 'вишня']")}},
{t:'У списку можуть бути значення різних типів: цілі й дробові числа, рядки, логічні значення. Усе разом, в одному списку. Функція print виводить його в консоль усіма значеннями.',a:async()=>{reset('mix',false);code(['mix = [5, "Оля", 3.14, True]','print(mix)','empty = []','print(empty)']);ln(0);await build(['5','"Оля"','3.14','True']);ln(1);o("[5, 'Оля', 3.14, True]")}},
{t:'А так записують порожній список — просто дві квадратні дужки без елементів. І при виведенні він дає лише порожні дужки.',a:async()=>{ln(2);row.innerHTML='';$('#nm').textContent='список empty — порожній';await sleep(1800);ln(3);o('[]')}}
]);

sc('Індекси',[
{t:'Кожен елемент має свій номер — індекс. Він записаний під елементом. І запам’ятайте головне: нумерація починається з нуля, а не з одиниці!',a:async()=>{reset('fruits',true);code([FC,'print(fruits[0])','print(fruits[2])','print(fruits[-1])','print(fruits[3])']);await build(F,250);for(let k=0;k<3;k++){hi([k]);await sleep(600)}hi([])}},
{t:'Щоб отримати елемент, пишемо ім’я списку, а в квадратних дужках — індекс. Індекс нуль — це перший елемент.',t2:'Беремо елемент fruits з індексом нуль — це яблуко.',a:async()=>{ln(1);at(0,'fruits[0]');hi([0]);await sleep(500);o('яблуко')}},
{t:'Індекс два — це третій, останній елемент списку.',t2:'Індекс два — це вишня.',a:async()=>{ln(2);at(2,'fruits[2]');hi([2]);await sleep(500);o('вишня')}},
{t:'Індекси можна рахувати й з кінця. Тоді вони від’ємні: мінус один — останній елемент, мінус два — передостанній.',t2:'Індекс мінус один показує на останню клітинку — це вишня.',a:async()=>{row.classList.add('neg');ln(3);at(2,'fruits[-1]');hi([2]);await sleep(500);o('вишня')}},
{t:'Якщо звернутися до індексу, якого не існує, Python покаже помилку IndexError, тобто помилку індексу. У нашому списку немає елемента з індексом три.',t2:'Клітинки з індексом три немає, тому Python повідомляє про помилку.',a:async()=>{row.classList.remove('neg');hi([]);ln(4);at(3,'fruits[3] ?');await sleep(600);o('IndexError: list index out of range',true)}}
]);

sc('Зміна елемента',[
{t:'Списки змінювані. Це означає, що елемент можна замінити, присвоївши нове значення за індексом.',a:async()=>{reset('fruits',true);code([FC,'fruits[1] = "ківі"','print(fruits)']);await build(F,200);ln(1);at(1,'fruits[1]');hi([1])}},
{t:'Замінюємо елемент з індексом один: банан стає ківі.',a:async()=>{await setv(1,'"ківі"')}},
{t:'Виводимо список — тепер у ньому яблуко, ківі та вишня.',a:async()=>{ln(2);hi([]);at();o("['яблуко', 'ківі', 'вишня']")}}
]);

sc('Додавання',[
{t:'Розглянемо список zoo — зоопарк із трьох тварин. Кожна тварина сидить у своїй клітці, а клітка — це позиція в списку. Як додати нову тварину?',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "слон", "зебра"]','zoo.append("жираф")','zoo.insert(1, "мавпа")','print(zoo)']);ln(0);await build(['лев','слон','зебра'],300)}},
{t:'Метод append, українською — «додати», дописує елемент у кінець списку. Додамо жирафа в нову клітку наприкінці.',t2:'Жираф заселяється в нову клітку в кінці списку.',a:async()=>{ln(1);await ins(3,'жираф')}},
{t:'Метод insert — «вставити» — вставляє елемент на вибране місце. Перший параметр, підкреслений синім, — індекс, другий, підкреслений зеленим, — значення. Поселимо мавпу в клітку з номером один. Наступні клітки зсуваються праворуч, а індекси перераховуються.',t2:'Мавпа займає клітку з індексом один, а слон, зебра й жираф зсуваються праворуч.',a:async()=>{ln(2);at(1,'позиція 1');await sleep(1200);at();await ins(1,'мавпа')}},
{t:'Тепер у зоопарку п’ять тварин.',a:async()=>{ln(3);o("['лев', 'мавпа', 'слон', 'зебра', 'жираф']")}}
]);

sc('Видалення',[
{t:'Тепер навпаки — звільняємо клітки. Візьмемо список zoo з п’яти тварин.',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "тигр", "слон", "зебра", "жираф"]','zoo.remove("слон")','zoo.pop()','x = zoo.pop(0)','zoo.insert(1, x)','other = []','other.append(zoo.pop(0))','del zoo[0]','print(zoo, other)']);ln(0);await build(['лев','тигр','слон','зебра','жираф'],250)}},
{t:'Метод remove — «вилучити» — видаляє перший елемент із указаним значенням. Заберемо зі списку слона.',t2:'Слон залишає свою клітку, а наступні клітки зсуваються ліворуч.',a:async()=>{ln(1);await del(2)}},
{t:'Метод pop — «вийняти» — без параметрів видаляє останній елемент і повертає його.',t2:'Жираф залишає останню клітку.',a:async()=>{ln(2);await del(cells().length-1)}},
{t:'Метод pop можна викликати й з індексом. Тоді виймається саме той елемент, що стоїть на цій позиції. Головне — pop повертає вийнятий елемент, тож його можна покласти в змінну x і використати далі. Виймемо елемент з індексом нуль.',t2:'Виймаємо тварину з клітки з індексом нуль — це лев.',a:async()=>{ln(3);at(0,'pop(0)');hi([0]);await sleep(1500)}},
{t:'Спершу pop з нулем виймає лева, а потім insert вставляє його на позицію один. Тварина переміщується на інше місце в тому самому списку.',k:1,t2:'Лев переходить на позицію один, а тигр займає першу клітку.',a:async()=>{at();hi([]);await sleep(450);ln(3);const m=move(0,row,1);await sleep(900);ln(4);await m}},
{t:'Вийнятий елемент можна покласти й в інший список. Створимо порожній список other.',a:async()=>{ln(5);$('#nm2').textContent='список other';$('#blk2').hidden=false}},
{t:'Тут pop з нулем виймає перший елемент зі списку zoo, а append дописує його в кінець списку other. Тигр переїжджає з одного списку в інший.',t2:'Тигр залишає список zoo й заселяється в клітку списку other.',a:async()=>{ln(6);at(0,'pop(0)');await sleep(900);at();await move(0,row2,0)}},
{t:'А інструкція del теж видаляє елемент за індексом, але, на відміну від pop, нічого не повертає. Видалимо елемент з індексом нуль — лева.',t2:'Лев зникає зі списку, а зебра зсувається на його місце.',a:async()=>{ln(7);await del(0)}},
{t:'У результаті в списку zoo лишилася зебра, а в списку other — тигр.',a:async()=>{ln(8);o("['зебра'] ['тигр']")}}
]);

sc('Корисне',[
{t:'Ще кілька корисних можливостей. Візьмемо список zoo із трьох тварин, розташованих не за алфавітом.',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "слон", "зебра"]','print(len(zoo))','print("зебра" in zoo)','print(zoo.index("слон"))','print(zoo.index("тигр"))','zoo.reverse()','print(zoo)','zoo.sort()','print(zoo)']);ln(0);await build(['лев','слон','зебра'],300)}},
{t:'Функція len, від слова length — «довжина», повертає кількість елементів у списку.',t2:'У списку три клітки, тож результат — три.',a:async()=>{ln(1);hi([0,1,2]);await sleep(1200);o('3')}},
{t:'Оператор in перевіряє, чи є значення у списку. Зебра є в нашому списку, тож результат — True.',t2:'Python знаходить зебру в третій клітці й повертає True.',a:async()=>{hi([2]);ln(2);await sleep(900);o('True')}},
{t:'Метод index — «індекс» — шукає значення у списку й повертає номер клітки, в якій воно знаходиться. Якщо такого значення немає, Python повідомить про помилку ValueError. Знайдемо, у якій клітці сидить слон.',t2:'Слон сидить у клітці з індексом один, тож результат — один.',a:async()=>{ln(3);hi([1]);at(1,'index = 1');await sleep(900);o('1')}},
{t:'А що буде, якщо шукати тварину, якої немає в списку? Метод index не зможе повернути номер клітки. У нашому зоопарку тигра немає — подивимось, що станеться.',p:()=>{at();hi([])},t2:'Клітки з тигром немає, тому Python показує помилку ValueError. Щоб її уникнути, спершу перевіряють наявність тварини оператором in.',a:async()=>{ln(4);hi([]);at(3,'тигр?');await sleep(900);o("ValueError: 'тигр' is not in list",true)}},
{t:'Метод reverse — «обернути» — розвертає список у зворотному порядку: останній елемент стає першим, а перший — останнім. Це ще не сортування, а лише зміна порядку на протилежний. Він змінює сам список.',p:()=>{at();hi([])},t2:'Клітки розставляються в зворотному порядку.',a:async()=>{hi([]);at();ln(5);await reorder([2,1,0])}},
{t:'Виводимо список — порядок став зворотним, але впорядкованим список не став.',a:async()=>{ln(6);o("['зебра', 'слон', 'лев']")}},
{t:'Метод sort — «сортувати» — розставляє елементи за зростанням, а рядки — за алфавітом. Він також змінює сам список.',t2:'Клітки розставляються за алфавітом: зебра, лев, слон.',a:async()=>{ln(7);await reorder([0,2,1])}},
{t:'Виводимо список — тепер він упорядкований.',a:async()=>{ln(8);o("['зебра', 'лев', 'слон']")}}
]);

sc('Зрізи',[
{t:'Зріз дозволяє взяти частину списку. Його записують із двокрапкою: початковий індекс і кінцевий.',a:async()=>{reset('nums',true);code(['nums = [10, 20, 30, 40, 50]','print(nums[1:4])','print(nums[:2])','print(nums[3:])','print(nums[0:5:2])','print(nums[1::2])','print(nums[::-1])','print(nums[4:0:-2])','part = nums[1:4]','print(part)','print(nums)']);row1.classList.add('narrow');row2.classList.add('narrow');ln(0);await build(NUM5,200);fm(2)}},
{t:'У зрізі від одного до чотирьох початковий індекс входить у результат, а кінцевий — ні. Тому беремо елементи з індексами один, два і три.',f:2,t2:'Підсвічені елементи — двадцять, тридцять і сорок. Це і є зріз.',a:async()=>{ln(1);dim([1,2,3]);hi([1,2,3]);await sleep(900);o('[20, 30, 40]')}},
{t:'Якщо початок не вказати, зріз почнеться з початку списку: беремо елементи до індексу два, не включно.',t2:'Беремо десять і двадцять.',a:async()=>{ln(2);dim([0,1]);hi([0,1]);await sleep(900);o('[10, 20]')}},
{t:'А якщо не вказати кінець, зріз іде до кінця списку.',t2:'Беремо сорок і п’ятдесят.',a:async()=>{ln(3);dim([3,4]);hi([3,4]);await sleep(900);o('[40, 50]')}},
{t:'У зрізі може бути й третє число — крок. Його записують після другої двокрапки. Зріз від нуля до п’яти з кроком два бере елементи з пропуском: після кожного взятого елемента індекс збільшується на два. Якщо крок не вказано, він дорівнює одиниці.',f:3,t2:'Беремо десять, пропускаємо двадцять, беремо тридцять, пропускаємо сорок і беремо п’ятдесят.',a:async()=>{ln(4);const p=[];for(const k of [0,2,4]){p.push(k);at(k,k?'+2':'старт');hi(p);dim(p);await sleep(1100)}at();o('[10, 30, 50]')}},
{t:'Початок і кінець можна пропустити, а крок залишити. Зріз з індексу один з кроком два бере кожний другий елемент, починаючи з другої клітки і до кінця списку.',f:3,t2:'Беремо двадцять і сорок.',a:async()=>{ln(5);const p=[];for(const k of [1,3]){p.push(k);at(k,k>1?'+2':'старт');hi(p);dim(p);await sleep(1100)}at();o('[20, 40]')}},
{t:'Крок може бути й від’ємним — тоді список перебирається з кінця до початку. Зріз без початку й кінця з кроком мінус один бере всі елементи у зворотному порядку: від останнього до першого.',f:3,t2:'Починаємо з п’ятдесяти й рухаємося вліво по одному елементу.',a:async()=>{ln(6);const p=[];for(const k of [4,3,2,1,0]){p.push(k);at(k,k===4?'старт':'-1');hi(p);dim(p);await sleep(800)}at();o('[50, 40, 30, 20, 10]')}},
{t:'Початок і кінець можна вказати й для від’ємного кроку. Тоді початковий індекс має бути більшим за кінцевий, бо ми рухаємося від більшого індексу до меншого. Візьмемо зріз від чотирьох до нуля. З кроком мінус два йдемо з кінця списку й беремо кожний другий елемент.',f:3,t2:'Беремо п’ятдесят, пропускаємо сорок, беремо тридцять. До нульового елемента дійти не можна: кінцевий індекс у результат не входить.',a:async()=>{ln(7);const p=[];for(const k of [4,2]){p.push(k);at(k,k===4?'старт':'-2');hi(p);dim(p);await sleep(1000)}at(0,'стоп: не входить');await sleep(1500);at();o('[50, 30]')}},
{t:'Важлива примітка: зріз не змінює початковий список. Він створює новий, окремий список із вибраних елементів. Збережемо зріз у змінну part.',t2:'Список part — новий і окремий. А початковий nums лишився без змін.',a:async()=>{ln(8);hi([1,2,3]);await sleep(900);$('#nm2').textContent='список part — новий список';$('#blk2').hidden=false;row=row2;await build(['20','30','40'],400);row=row1;hi([]);sv(['зріз створює новий список, nums не змінився']);ln(9);o('[20, 30, 40]');await sleep(900);ln(10);o('[10, 20, 30, 40, 50]')}}
]);

const CL=['червоний','зелений','синій'];
sc('Цикл for',[
{t:'Дуже часто елементи списку потрібно перебрати по одному. Для цього використовують цикл for.',a:async()=>{reset('colors',true);code(['colors = ["червоний", "зелений", "синій"]','for c in colors:','    print(c)','for i in range(len(colors)):','    print(i, colors[i])']);ln(0);await build(CL.map(x=>'"'+x+'"'),250)}},
{t:'У циклі змінна c по черзі набуває значення кожного елемента списку. Праворуч під списком показано, чому дорівнює c на кожному кроці.',t2:'Змінна c спершу дорівнює червоному, потім зеленому, а потім синьому.',a:async()=>{for(let k=0;k<3;k++){ln(1);hi([k]);at(k,'c');sv(['c = "'+CL[k]+'"']);await sleep(1200);ln(2);o(CL[k]);await sleep(1100)}}},
{t:'Другий спосіб — перебирати індекси. Функція range від len(colors) дає числа від нуля до двох, тобто всі індекси списку. Так ми отримуємо і номер, і значення елемента.',t2:'Змінна i набуває значень нуль, один і два, а колір беремо за цим індексом.',a:async()=>{out.innerHTML='';hi([]);at();await sleep(500);for(let k=0;k<3;k++){ln(3);hi([k]);at(k,'i = '+k);sv(['colors['+k+'] = "'+CL[k]+'"']);await sleep(1200);ln(4);o(k+' '+CL[k]);await sleep(1100)}}}
]);

sc('Підсумок',[
{t:'Підсумуємо. Список створюють у квадратних дужках. До елементів звертаються за індексом, який починається з нуля, а від’ємні індекси рахують з кінця.',a:async()=>{reset('',false);code(['a = [1, 2, 3]            # створити','a[0], a[-1]             # доступ','a[1] = 5                # змінити','a.append(x)  a.insert(i, x)   # додати','a.remove(x)  a.pop()  del a[i] # видалити','len(a)  x in a  a.sort()      # корисне','a[1:3]  for x in a:           # зрізи, цикл']);ln(0);await sleep(2500);ln(1)}},
{t:'Елемент можна змінити за індексом, додати методами append та insert, а видалити — remove, pop або del.',a:async()=>{ln(2);await sleep(1800);ln(3);await sleep(2000);ln(4)}},
{t:'Довжину дізнаємося через len, наявність значення перевіряємо оператором in, а впорядковуємо методом sort. Беремо зрізи й перебираємо елементи циклом for. Дякую за увагу — і успіхів у програмуванні!',a:async()=>{ln(5);await sleep(2500);ln(6)}}
]);

LS[0]={S,titles,starts};S=[];titles=[];starts=[];

sc('Копіювання списку',[
{t:'Продовжуємо вивчати списки. Спершу — копіювання. Запис b = a не створює новий список: це лише друге ім’я для того самого списку.',a:async()=>{reset('a',true);code(['a = ["лев", "слон", "зебра"]','b = a','b[0] = "тигр"','print(a)','c = a.copy()','c[0] = "мавпа"','print(a, c)']);ln(0);await build(['лев','слон','зебра'],300)}},
{t:'Після b = a обидва імені, a і b, вказують на один і той самий список у пам’яті.',a:async()=>{ln(1);$('#nm').textContent='список a = b (один список, два імені)'}},
{t:'Змінимо b[0]. Але список один, тому змінюється й a!',a:async()=>{ln(2);await rep(0,'тигр')}},
{t:'Тож print(a) показує тигра на першому місці.',a:async()=>{ln(3);o("['тигр', 'слон', 'зебра']")}},
{t:'Щоб отримати справжню копію, використовують метод copy, українською — «копіювати». Те саме робить зріз a[:]. Копія — окремий список.',a:async()=>{ln(4);$('#nm').textContent='список a';$('#nm2').textContent='список c — окрема копія';$('#blk2').hidden=false;for(let k=0;k<3;k++)await move(k,row2,k,1)}},
{t:'Змінимо c[0]. Вихідний список a не змінюється, бо c — окремий список.',a:async()=>{ln(5);row=row2;await rep(0,'мавпа');row=row1;ln(6);o("['тигр', 'слон', 'зебра'] ['мавпа', 'слон', 'зебра']")}}
]);

sc('Об’єднання',[
{t:'Два списки можна об’єднати. Візьмемо zoo з двох тварин і new ще з двох.',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "слон"]','new = ["зебра", "жираф"]','zoo.extend(new)','print(zoo)','big = zoo + ["мавпа"]','print(big)']);ln(0);await build(['лев','слон'],300);ln(1);$('#nm2').textContent='список new';$('#blk2').hidden=false;row=row2;await build(['зебра','жираф'],300);row=row1}},
{t:'Метод extend — «розширити» — дописує в кінець списку всі елементи іншого списку. Сам список new при цьому не змінюється.',t2:'Тварини з new копіюються в кінець zoo.',a:async()=>{ln(2);row=row2;for(let k=0;k<2;k++)await move(k,row1,2+k,1);row=row1}},
{t:'Результат: у zoo чотири тварини, а new лишився без змін.',a:async()=>{ln(3);o("['лев', 'слон', 'зебра', 'жираф']")}},
{t:'Знак плюс теж об’єднує списки, але створює новий список, а zoo не змінюється. Покладемо результат у змінну big.',t2:'Створюється новий список big з п’яти тварин.',a:async()=>{ln(4);hi([0,1,2,3]);await sleep(700);hi([]);$('#nm2').textContent='список big — новий список';row2.innerHTML='';row=row2;await build(['лев','слон','зебра','жираф','мавпа'],350);row=row1;ln(5);o("['лев', 'слон', 'зебра', 'жираф', 'мавпа']")}}
]);

sc('Підрахунок',[
{t:'Метод count — «порахувати» — повертає, скільки разів значення зустрічається у списку. Візьмемо зоопарк, де є два леви.',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "слон", "лев", "зебра"]','print(zoo.count("лев"))','print(zoo.count("тигр"))']);ln(0);await build(['лев','слон','лев','зебра'],300)}},
{t:'Метод проходить по всьому списку й підраховує збіги. Леви сидять у клітках нуль і два.',t2:'Знайдено двох левів, результат — два.',a:async()=>{ln(1);const p=[];for(const k of [0,2]){p.push(k);at(k,'збіг '+p.length);hi(p);await sleep(1000)}at();o('2')}},
{t:'Якщо значення немає, count не видає помилки, як index, а просто повертає нуль.',a:async()=>{ln(2);hi([]);await sleep(600);o('0')}}
]);

sc('min, max, sum',[
{t:'Для списку чисел є корисні функції min, max і sum. Нехай ages — вік тварин у зоопарку.',a:async()=>{reset('ages',true);row1.classList.add('narrow');code(['ages = [4, 9, 2, 7]','print(min(ages))','print(max(ages))','print(sum(ages))']);ln(0);await build(['4','9','2','7'],300)}},
{t:'Функція min — «мінімум» — повертає найменше значення.',t2:'Найменше число — два.',a:async()=>{ln(1);at(2,'min');hi([2]);await sleep(900);o('2')}},
{t:'Функція max — «максимум» — повертає найбільше значення.',t2:'Найбільше число — дев’ять.',a:async()=>{ln(2);at(1,'max');hi([1]);await sleep(900);o('9')}},
{t:'Функція sum — «сума» — додає всі елементи списку.',t2:'Чотири плюс дев’ять плюс два плюс сім — двадцять два.',a:async()=>{ln(3);const v=[4,9,2,7];let s=0;for(let k=0;k<4;k++){s+=v[k];hi([k]);at(k,'+'+v[k]);sv(['сума = '+s]);await sleep(1000)}at();hi([]);o('22')}}
]);

sc('Створення списків',[
{t:'У першому уроці ми створювали списки, записуючи елементи вручну. Є й інші способи. Множення списку на число повторює його елементи: запис [0] * 4 дає список із чотирьох нулів. Це зручно, коли потрібен список заданої довжини.',a:async()=>{reset('c',true);row1.classList.add('narrow');code(['c = [0] * 4','d = list(range(5))','e = list(range(1, 10, 2))','f = list("лев")','a = input().split()','b = list(map(int, input().split()))','zoo = "лев,слон,зебра".split(",")']);ln(0);await build(['0','0','0','0'],300);o('[0, 0, 0, 0]')}},
{t:'Функція range створює послідовність чисел, а функція list перетворює її на список. Послідовність range — ітерований об’єкт, тобто такий, який можна перебирати по одному елементу. range(5) дає числа від нуля до чотирьох.',a:async()=>{ln(1);dim();row1.innerHTML='';$('#nm').textContent='список d';await build(['0','1','2','3','4'],300);o('[0, 1, 2, 3, 4]')}},
{t:'У range можна вказати початок, кінець і крок, як у зрізах. Кінець не входить. range(1, 10, 2) дає непарні числа від одного до дев’яти.',a:async()=>{ln(2);dim();row1.innerHTML='';$('#nm').textContent='список e';await build(['1','3','5','7','9'],300);o('[1, 3, 5, 7, 9]')}},
{t:'Рядок теж ітерований об’єкт: його можна перебирати по символах. Тому list("лев") створює список із трьох символів.',a:async()=>{ln(3);dim();row1.innerHTML='';$('#nm').textContent='список f';await build(['"л"','"е"','"в"'],350);o("['л', 'е', 'в']")}},
{t:'Ще один спосіб — створити список з даних, які вводить користувач. Функція input читає рядок, а метод split — «розділити» — розбиває рядок на частини за пробілами й повертає список рядків. Нехай користувач ввев: три, вісім, п’ять.',t2:'Рядок розрізано за пробілами на три частини.',a:async()=>{ln(4);dim();o('⌨ 3 8 5');await sleep(600);row1.innerHTML='';$('#nm').textContent='список a';await build(['"3"','"8"','"5"'],400);o("['3', '8', '5']")}},
{t:'Але це рядки, а не числа. Щоб отримати числа, кожен елемент перетворюють функцією int. Функція map — «застосувати» — застосовує int до кожного елемента, а list збирає результат у список чисел.',t2:'Рядки «три», «вісім» і «п’ять» стають числами.',a:async()=>{ln(5);dim();$('#nm').textContent='список b';const v=[3,8,5];for(let k=0;k<3;k++)await rep(k,''+v[k]);o('[3, 8, 5]')}},
{t:'Метод split працює й з текстом. За замовчуванням він розділяє рядок за пробілами, але в дужках можна вказати свій роздільник. Рядок, де назви тварин записані через коми, розділяємо викликом split із комою.',t2:'Рядок розрізається по комах, а коми зникають: виходять три окремі тварини.',a:async()=>{ln(6);dim();sv(['текст: "лев,слон,зебра"']);await sleep(900);row1.innerHTML='';$('#nm').textContent='список zoo';await build(['лев','слон','зебра'],400);o("['лев', 'слон', 'зебра']")}},
{t:'Для випадкових значень використовують модуль random. Його підключають командою import random. Функція randint — «випадкове ціле» — повертає випадкове число від першого до другого значення включно. Числа в прикладі умовні: при кожному запуску вони різні.',a:async()=>{reset('g',true);row1.classList.add('narrow');row2.classList.add('narrow');code(['import random','g = []','for i in range(4):','    g.append(random.randint(1, 10))','h = random.sample(range(1, 50), 4)','print(g, h)']);ln(0);sv(['random.randint(1, 10) → 6'])}},
{t:'Щоб створити список випадкових чисел, спочатку створюють порожній список, а потім у циклі чотири рази додають випадкове число методом append.',t2:'Кожного разу randint повертає нове число.',a:async()=>{const v=[6,2,9,4];for(let k=0;k<4;k++){ln(2);sv(['i = '+k]);await sleep(500);ln(3);sv(['random.randint(1, 10) → '+v[k]]);await ins(k,''+v[k])}sv([])}},
{t:'Функція sample вибирає з послідовності задану кількість різних елементів. Тут — чотири різні числа від одного до сорока дев’яти, повторів не буде.',t2:'Числа знову випадкові, і вони не повторюються.',a:async()=>{ln(4);dim();$('#nm2').textContent='список h';$('#blk2').hidden=false;row=row2;await build(['17','3','42','25'],400);row=row1;ln(5);o('[6, 2, 9, 4] [17, 3, 42, 25]')}}
]);

sc('Задачі з циклом',[
{t:'Тепер задачі, які не вирішуються однією стандартною функцією. Перша — відібрати в новий список лише ті значення, що більші за п’ять. Спершу створюємо порожній список old.',a:async()=>{reset('ages',true);row1.classList.add('narrow');row2.classList.add('narrow');code(['ages = [4, 9, 2, 7]','old = []','for a in ages:','    if a > 5:','        old.append(a)','print(old)']);ln(0);await build(['4','9','2','7'],250);ln(1);$('#nm2').textContent='список old — порожній';$('#blk2').hidden=false}},
{t:'У циклі перевіряємо кожен елемент. Якщо a більше за п’ять, додаємо його в кінець списку old методом append.',t2:'Дев’ятка і сімка пройшли перевірку, а чотири й два — ні.',a:async()=>{const v=[4,9,2,7];let j=0;for(let k=0;k<4;k++){ln(2);hi([k]);at(k,'a');sv(['a = '+v[k]]);await sleep(800);ln(3);await sleep(700);if(v[k]>5){ln(4);await move(k,row2,j,1);j++}}at();hi([]);sv([]);ln(5);o('[9, 7]')}},
{t:'Друга задача — змінити елементи списку на місці: подвоїти кожне число. Для зміни за індексом потрібен цикл по індексах.',a:async()=>{out.innerHTML='';sv([]);$('#blk2').hidden=true;row2.innerHTML='';code(['ages = [4, 9, 2, 7]','for i in range(len(ages)):','    ages[i] = ages[i] * 2','print(ages)']);ln(0)}},
{t:'У циклі беремо індекс i, множимо елемент ages[i] на два й записуємо результат назад на те саме місце.',t2:'Список змінюється на місці: чотири, дев’ять, два й сім стають вісім, вісімнадцять, чотири й чотирнадцять.',a:async()=>{const v=[4,9,2,7];for(let k=0;k<4;k++){ln(1);hi([k]);at(k,'i = '+k);sv(['ages['+k+'] = '+v[k]]);await sleep(800);ln(2);await rep(k,''+v[k]*2);sv(['ages['+k+'] = '+v[k]*2])}at();hi([]);sv([]);ln(3);o('[8, 18, 4, 14]')}}
]);

LS[1]={S,titles,starts};S=[];titles=[];starts=[];
function swp(j){const q=[...Array(cells().length).keys()];q[j]=j+1;q[j+1]=j;return reorder(q)}
let BA=[4,9,2,7];
async function bub(i0,i1){const n=BA.length;for(let i=i0;i<i1;i++)for(let j=0;j<n-1-i;j++){ln(2);hi([j,j+1]);at(j,'j = '+j);sv(['i = '+i,'j = '+j]);await sleep(800);ln(3);await sleep(600);if(BA[j]>BA[j+1]){ln(4);await sleep(300);ln(5);await sleep(300);ln(6);const t=BA[j];BA[j]=BA[j+1];BA[j+1]=t;await swp(j)}}at();hi([])}
function fx(a){const e=$('#fm');e.hidden=!a;if(!a){e.innerHTML='';return}const rows=Array.isArray(a[0]);e.style.flexDirection=rows?'column':'';if(rows){e.innerHTML=a.map(r=>'<div class="fr">'+fxr(r)+'</div>').join('');return}e.innerHTML=fxr(a)}
function fxr(a){return a.map(x=>typeof x==='string'?'<span>'+esc(x)+'</span>':'<span class="pt '+x[1]+'">'+esc(x[0])+'<i>↓</i><u>'+x[2]+'</u></span>').join('')}

sc('Обмін елементів',[
{t:'Третій урок — про алгоритми. Почнемо з простої операції: обміну двох елементів. Поміняємо місцями першу й останню тварину. Для цього знадобиться допоміжна змінна tmp.',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "слон", "зебра"]','tmp = zoo[0]','zoo[0] = zoo[2]','zoo[2] = tmp','print(zoo)']);row2.classList.add('noidx');ln(0);await build(['лев','слон','зебра'],300)}},
{t:'Спершу запам’ятовуємо лева в змінній tmp, інакше ми його втратимо. Змінну tmp показано окремою тимчасовою кліткою під списком.',a:async()=>{ln(1);at(0,'zoo[0]');hi([0]);await sleep(700);$('#nm2').textContent='змінна tmp (тимчасова клітка)';$('#blk2').hidden=false;row2.innerHTML='';await move(0,row2,0,1);hi([]);at()}},
{k:1,t:'Тепер у клітку нуль записуємо зебру з клітки два. Лев нікуди не зник — він збережений в tmp.',a:async()=>{ln(2);at(2,'zoo[2]');hi([2]);await sleep(700);await move(2,row1,0,1);await del(1);hi([]);at()}},
{k:1,t:'І нарешті в останню клітку записуємо лева з tmp. Обмін завершено.',a:async()=>{ln(3);at(2,'zoo[2]');await sleep(700);row=row2;await move(0,row1,2,1);row=row1;await del(3);at();hi([])}},
{t:'Виводимо список: лев і зебра помінялися місцями.',a:async()=>{ln(4);o("['зебра', 'слон', 'лев']")}}
]);

sc('Лінійний пошук',[
{t:'Лінійний пошук — перебираємо елементи по черзі, поки не знайдемо потрібний. Шукаємо число два. У змінній pos зберігатимемо його позицію, а мінус один означатиме «не знайдено».',a:async()=>{reset('ages',true);row1.classList.add('narrow');code(['ages = [4, 9, 2, 7]','x = 2','pos = -1','for i in range(len(ages)):','    if ages[i] == x:','        pos = i','print(pos)']);ln(0);await build(['4','9','2','7'],250);ln(2);sv(['x = 2','pos = -1'])}},
{t:'У циклі порівнюємо кожен елемент із x. Два знаки «дорівнює» означають порівняння, а не присвоєння.',t2:'Чотири не дорівнює двом, дев’ять теж ні, а ось на індексі два знайшли шуканий елемент.',a:async()=>{let pos=-1;for(let k=0;k<4;k++){ln(3);hi([k]);at(k,'i = '+k);sv(['x = 2','pos = '+pos]);await sleep(800);ln(4);await sleep(600);if([4,9,2,7][k]===2){ln(5);pos=k;sv(['x = 2','pos = '+pos]);await sleep(900)}}at();hi([]);ln(6);o('2')}},
{t:'Якщо елемента немає, pos так і лишиться мінус одиницею. Це відрізняє такий пошук від методу index, який у цьому випадку видає помилку.',a:async()=>{ln(2)}}
]);

sc('Вбудоване сортування',[
{t:'Звичайно, у Python є й готові засоби. Метод sort ми вже знаємо, а в дужках йому можна передати параметр reverse. Якщо reverse дорівнює True, сортування буде за спаданням. Є й функція sorted — «відсортований».',a:async()=>{reset('ages',true);row1.classList.add('narrow');row2.classList.add('narrow');code(['ages = [4, 9, 2, 7]','ages.sort(reverse=True)','new = sorted(ages)','print(ages, new)']);ln(0);await build(['4','9','2','7'],250)}},
{t:'Метод sort із параметром reverse, що дорівнює True, розставляє елементи від більшого до меншого й змінює сам список.',t2:'Клітки розставляються за спаданням.',a:async()=>{ln(1);dim();await reorder([1,3,0,2])}},
{t:'Функція sorted, на відміну від методу sort, не змінює початковий список, а повертає новий, впорядкований за зростанням.',t2:'У новому списку new числа за зростанням, а ages лишився за спаданням.',a:async()=>{ln(2);dim();$('#nm2').textContent='список new — новий список';$('#blk2').hidden=false;row=row2;await build(['2','4','7','9'],350);row=row1;ln(3);o('[9, 7, 4, 2] [2, 4, 7, 9]')}}
]);

sc('Типові помилки',[
{t:'Розглянемо кілька типових помилок. Перша: remove видаляє лише перший збіг.',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "слон", "лев"]','zoo.remove("лев")','x = zoo.sort()','print(x)','zoo = zoo.sort()']);ln(0);await build(['лев','слон','лев'],300)}},
{t:'Метод remove видаляє тільки перший елемент зі значенням «лев». Другий лев залишається у списку.',t2:'Зникла лише перша клітка з левом.',a:async()=>{ln(1);hi([0]);await sleep(700);await del(0)}},
{t:'Друга помилка: sort змінює сам список і нічого не повертає. Тому x стає особливим значенням None, тобто «нічого».',t2:'Список впорядкувався, а в змінну x потрапило None.',a:async()=>{ln(2);await reorder([1,0]);ln(3);o('None')}},
{t:'Тому запис zoo = zoo.sort() — типова помилка: список втрачається, а zoo стає None. Правильно просто викликати zoo.sort().',a:async()=>{ln(4);await sleep(700);row.innerHTML='';$('#nm').textContent='zoo = None — список втрачено'}}
]);

sc('Генератори списків',[
{t:'Тепер короткий спосіб створювати списки — генератор списку, англійською list comprehension. Він замінює цикл із append, який ми вже вміємо, одним рядком. Візьмемо вік тварин у зоопарку.',a:async()=>{reset('ages',true);row1.classList.add('narrow');row2.classList.add('narrow');code(['ages = [4, 9, 2, 7]','double2 = [a * 2 for a in ages]','big = [a for a in ages if a > 5]','new = [a * 2 if a > 5 else a for a in ages]','sq = [i * i for i in range(1, 6)]']);ln(0);await build(['4','9','2','7'],250)}},

{t:'Генератор списку створює новий список в одному рядку. Загальний вигляд запису показано праворуч. Подвоїмо кожне число. У квадратних дужках спочатку вираз — що додати в новий список, а потім цикл for — звідки брати елементи.',seg:[['Генератор списку створює новий список в одному рядку. Загальний вигляд запису показано праворуч. Подвоїмо кожне число. У квадратних дужках спочатку записують вираз — що додати в новий список.','pe'],['Потім іде цикл for — він визначає, звідки брати елементи.','pf']],f:[['[',['вираз','c1','що додати в новий список'],['for змінна in послідовність','c2','звідки брати елементи'],']']],t2:'Результат той самий.',a:async()=>{ln(1);dim();hi([0,1,2,3]);await sleep(900);hi([]);$('#nm2').textContent='список double2';row2.innerHTML='';row=row2;await build(['8','18','4','14'],300);row=row1;o('[8, 18, 4, 14]')}},
{t:'До генератора можна додати умову if. У новий список потраплять лише ті елементи, для яких умова істинна.',seg:[['До генератора можна додати умову if. Спершу, як і раніше, записуємо вираз.','pe'],['Потім цикл for.','pf'],['А в кінці — умова if: у новий список потраплять лише ті елементи, для яких умова істинна.','pc']],f:[['[',['вираз','c1','що додати'],['for змінна in послідовність','c2','звідки брати'],['if умова','c3','кого відбирати'],']']],t2:'Умова виконується для дев’ятки й сімки.',a:async()=>{ln(2);dim([1,3]);hi([1,3]);await sleep(1000);$('#nm2').textContent='список big';row2.innerHTML='';row=row2;await build(['9','7'],400);row=row1;dim();hi([]);o('[9, 7]')}},
{t:'Генератор може не лише відбирати, а й змінювати елементи залежно від умови. Для цього умову з else записують перед циклом: якщо умова істинна, береться перший вираз, а якщо хибна — другий. Усі елементи зберігаються: одні подвоюються, а інші лишаються як були.',seg:[['Генератор може не лише відбирати, а й змінювати елементи залежно від умови. Спершу йде вираз для випадку, коли умова істинна.','pe'],['Далі умова if — це перевірка.','pc'],['Після else стоїть вираз для випадку, коли умова хибна.','pe2'],['І наприкінці цикл for. Усі елементи зберігаються: одні подвоюються, а інші лишаються як були.','pf']],f:[['[',['вираз1','c1','якщо умова істинна'],['if умова','c3','перевірка'],['else вираз2','c1','якщо хибна'],['for змінна in послідовність','c2','звідки брати'],']']],t2:'Дев’ятка й сімка більші за п’ять, тому подвоюються. Чотири й два лишаються без змін.',a:async()=>{ln(3);dim();$('#nm2').textContent='список new';$('#blk2').hidden=false;row2.innerHTML='';const v=[4,9,2,7];for(let k=0;k<4;k++){row=row1;hi([k]);at(k,v[k]>5?'a * 2':'a');await sleep(900);row=row2;await ins(k,''+(v[k]>5?v[k]*2:v[k]))}row=row1;at();hi([]);o('[4, 18, 2, 14]')}},
{t:'Джерелом може бути й range. Квадрати чисел від одного до п’яти запишемо так.',seg:[['Джерелом елементів може бути й range. Квадрати чисел від одного до п’яти запишемо так. Вираз — це i помножити на i.','pe'],['Цикл for бере числа з range від одного до п’яти.','pf']],f:[['[',['вираз','c1','що додати'],['for змінна in послідовність','c2','звідки брати'],']']],t2:'Вираз i помножити на i обчислюється для кожного числа з range.',a:async()=>{ln(4);dim();$('#nm').textContent='список sq';row1.innerHTML='';row2.innerHTML='';$('#blk2').hidden=true;await build(['1','4','9','16','25'],350);o('[1, 4, 9, 16, 25]')}}

sc('Розворот списку вручну',[

{k:1,t:'Тепер i дорівнює одиниці, а j — двом. Міняємо слона із зеброю.',t2:'Слон і зебра міняються місцями.',a:async()=>{ln(3);hi([1,2]);await sleep(500);ln(4);await sleep(300);ln(5);await sleep(300);ln(6);await swg(1,2);ln(7);sv(['i = 2','j = 1']);hi([]);at()}},
{t:'Тепер i дорівнює двом, а j — одиниці. Умова i менше за j хибна, цикл завершується. Список розвернуто.',a:async()=>{ln(3);await sleep(600);ln(9);o("['жираф', 'зебра', 'слон', 'лев']")}}

sc('Видалення дублікатів',[
{t:'Друга задача: видалити повтори. У зоопарку записані тварини, і деякі згадані двічі. Створимо новий список uniq, куди додаватимемо лише тих, кого там ще немає. Оператор not in означає «не міститься».',a:async()=>{reset('zoo',true);code(['zoo = ["лев", "слон", "лев", "зебра", "слон"]','uniq = []','for a in zoo:','    if a not in uniq:','        uniq.append(a)','print(uniq)']);ln(0);await build(['лев','слон','лев','зебра','слон'],250);$('#nm2').textContent='список uniq';$('#blk2').hidden=false;ln(1)}},
{t:'Перебираємо тварин. Якщо тварини ще немає в uniq, додаємо її. Якщо вже є — пропускаємо.',t2:'Лев і слон потрапляють у uniq. Другий лев і другий слон вже є, тому їх пропускаємо. Зебра додається.',a:async()=>{const v=['лев','слон','лев','зебра','слон'],u=[];for(let k=0;k<5;k++){ln(2);hi([k]);at(k,'a');await sleep(800);ln(3);await sleep(600);if(!u.includes(v[k])){ln(4);await move(k,row2,u.length,1);u.push(v[k])}else{at(k,'вже є');await sleep(900)}}at();hi([]);ln(5);o("['лев', 'слон', 'зебра']")}}

{t:'Тепер в останню клітку записуємо збережений first — лева.',t2:'Лев із змінної first переїжджає в кінець списку.',a:async()=>{ln(4);at(3,'zoo[3]');row=row2;await move(0,row1,3,1);row=row1;await del(4);at();ln(5);o("['слон', 'зебра', 'жираф', 'лев']")}}

sc('Сортування «бульбашкою»',[
{t:'Це урок для допитливих — необов’язковий матеріал для тих, кому цікаво глибше. Тепер сортування вручну. Ідея «бульбашки»: порівнюємо сусідні елементи й міняємо їх місцями, якщо лівий більший за правий. Після кожного проходу найбільше число «спливає» в кінець.',a:async()=>{BA=[4,9,2,7];reset('ages',true);row1.classList.add('narrow');code(['ages = [4, 9, 2, 7]','for i in range(len(ages) - 1):','    for j in range(len(ages) - 1 - i):','        if ages[j] > ages[j + 1]:','            tmp = ages[j]','            ages[j] = ages[j + 1]','            ages[j + 1] = tmp','print(ages)']);ln(0);await build(['4','9','2','7'],250)}},
{t:'Перший прохід. Зовнішній цикл рахує проходи, внутрішній перебирає пари сусідів: j і j плюс один. Якщо пара стоїть не в порядку, елементи міняються місцями, як ми вчили.',t2:'Чотири й дев’ять у порядку. Дев’ять і два — міняємо. Дев’ять і сім — теж міняємо. Дев’ятка пливе в кінець.',a:async()=>{ln(1);hi([0,1]);await bub(0,1)}},
{t:'Другий і третій проходи. З кожним проходом внутрішній цикл коротший, бо кінець списку вже впорядкований.',t2:'Чотирка й двійка міняються, далі пари вже в порядку.',a:async()=>{ln(1);hi([0,1]);await bub(1,3)}},
{t:'Готово: список впорядковано за зростанням.',a:async()=>{ln(7);o('[2, 4, 7, 9]')}}
]);

let SA=[6,3,8,1,7,2],IA=[6,3,8,1,7,2];
async function sel(i0,i1){const n=SA.length;for(let i=i0;i<i1;i++){let m=i;for(let j=i+1;j<n;j++){ln(3);hi([m,j]);at(j,'j');sv(['i = '+i,'m = '+m,'j = '+j]);await sleep(450);if(SA[j]<SA[m]){ln(5);m=j;sv(['i = '+i,'m = '+m,'j = '+j]);await sleep(300)}}ln(6);hi([i,m]);at(m,'мін.');await sleep(700);if(m!==i){ln(7);const t=SA[i];SA[i]=SA[m];SA[m]=t;await swg(i,m)}hi([]);at()}}
async function insr(i0,i1){for(let i=i0;i<i1;i++){const x=IA[i];let j=i-1;ln(2);hi([i]);at(i,'x');sv(['i = '+i,'x = '+x]);await sleep(800);ln(3);while(j>=0&&IA[j]>x){ln(4);hi([j,j+1]);await sleep(450);ln(5);IA[j+1]=IA[j];IA[j]=x;await swg(j,j+1);j--;sv(['i = '+i,'x = '+x,'j = '+j]);at(j+1,'x')}ln(7);hi([j+1]);await sleep(500)}hi([]);at()}

sc('Сортування вибором',[

{t:'Решта чисел уже стоїть на своїх місцях: шість, сім і вісім. Алгоритм завершено.',a:async()=>{ln(1);hi([]);await sel(3,5);ln(9);o('[1, 2, 3, 6, 7, 8]')}}

{t:'Сортування вставками схоже на те, як розкладають карти в руці. Ліва частина списку завжди впорядкована. Беремо наступний елемент і вставляємо його на правильне місце серед уже впорядкованих.',a:async()=>{IA=[6,3,8,1,7,2];reset('a',true);row1.classList.add('narrow');code(['a = [6, 3, 8, 1, 7, 2]','for i in range(1, len(a)):','    x = a[i]','    j = i - 1','    while j >= 0 and a[j] > x:','        a[j + 1] = a[j]','        j = j - 1','    a[j + 1] = x','print(a)']);ln(0);await build(['6','3','8','1','7','2'],250)}},

]);

sc('Швидке сортування',[
{t:'Швидке сортування, англійською quicksort, працює за принципом «розділяй і володарюй». Обираємо опорний елемент pivot. Усі менші за нього йдуть ліворуч, а більші чи рівні — праворуч. Потім так само сортуємо кожну частину окремо.',a:async()=>{reset('a',true);row1.classList.add('narrow');code(['def quick(a):','    if len(a) <= 1:','        return a','    p = a[0]','    less = [x for x in a[1:] if x < p]','    more = [x for x in a[1:] if x >= p]','    return quick(less) + [p] + quick(more)','print(quick([6, 3, 8, 1, 7, 2]))']);ln(0);await build(['6','3','8','1','7','2'],250)}},
{t:'Беремо перший елемент як опорний: p дорівнює шести. У less потраплять числа, менші за шість, у more — решта.',t2:'Менші за шість: три, один і два. Більші: вісім і сім. Опорний елемент стає між ними.',a:async()=>{ln(3);hi([0]);at(0,'p = 6');sv(['p = 6']);await sleep(900);ln(4);await reorder([1,3,5,0,2,4]);at();hi([3]);sv(['p = 6','less = [3, 1, 2]','more = [8, 7]'])}},
{t:'Тепер так само сортуємо ліву частину: три, один і два. Опорний елемент — три, менші за нього — один і два.',t2:'Ліва частина стає: один, два, три.',a:async()=>{ln(6);dim([0,1,2]);hi([]);sv(['p = 3','less = [1, 2]','more = []']);await sleep(1000);await reorder([1,2,0,3,4,5]);hi([2]);await sleep(600)}},
{t:'Права частина — вісім і сім. Опорний елемент — вісім, менший за нього тільки сім.',t2:'Сім і вісім міняються місцями.',a:async()=>{ln(6);dim([4,5]);hi([]);sv(['p = 8','less = [7]','more = []']);await sleep(1000);await reorder([0,1,2,3,5,4]);hi([])}},
{t:'Складаємо результат: ліва частина, опорний елемент і права частина. Список впорядковано.',a:async()=>{dim();hi([]);sv([]);ln(7);o('[1, 2, 3, 6, 7, 8]')}}
]);

sc('Сортування злиттям',[
{t:'Сортування злиттям теж працює за принципом «розділяй і володарюй». Спершу список ділиться навпіл, кожна половина впорядковується, а потім дві впорядковані половини зливаються в один впорядкований список.',a:async()=>{reset('a',true);row1.classList.add('narrow');row2.classList.add('narrow');code(['def merge_sort(a):','    if len(a) <= 1:','        return a','    mid = len(a) // 2','    left = merge_sort(a[:mid])','    right = merge_sort(a[mid:])','    return merge(left, right)']);ln(0);await build(['6','3','8','1','7','2'],250)}},
{t:'Знаходимо середину списку: mid дорівнює трьом. Ліва половина — перші три елементи, права — решта.',t2:'Список розділено на дві половини: шість, три, вісім і один, сім, два.',a:async()=>{ln(3);hi([2]);at(2,'mid = 3');await sleep(900);dim([0,1,2]);hi([]);at();await sleep(1200);dim([3,4,5]);await sleep(1200);dim()}},
{t:'Кожну половину сортуємо цією самою функцією, тобто рекурсивно. Так кожна половина стає впорядкованою.',t2:'Ліва половина: три, шість, вісім. Права: один, два, сім.',a:async()=>{ln(4);dim([0,1,2]);await reorder([1,0,2,3,4,5]);ln(5);dim([3,4,5]);await reorder([0,1,2,3,5,4]);dim()}},
{t:'Тепер злиття. Беремо по вказівнику в кожній половині й щоразу переносимо в результат менший із двох елементів, на які вказують i та j.',a:async()=>{code(['def merge(left, right):','    result = []','    i = 0','    j = 0','    while i < len(left) and j < len(right):','        if left[i] <= right[j]:','            result.append(left[i])','            i = i + 1','        else:','            result.append(right[j])','            j = j + 1','    return result + left[i:] + right[j:]']);ln(0);$('#nm2').textContent='список result';$('#blk2').hidden=false;row2.innerHTML=''}},
{t:'Порівнюємо три й один: одиниця менша, тому в result іде одиниця. Далі двійка, потім трійка, шістка, сімка. Коли права половина закінчилась, решту лівої, тобто вісімку, просто дописуємо.',t2:'Список result росте з менших елементів, і в ньому вже все впорядковано.',a:async()=>{const L=[3,6,8],R=[1,2,7];let i=0,j=0,k=0;while(i<3||j<3){ln(5);const hs=[];if(i<3)hs.push(i);if(j<3)hs.push(3+j);hi(hs);sv(['i = '+i,'j = '+j]);await sleep(600);let src;if(j>=3||(i<3&&L[i]<=R[j])){src=i;i++;ln(6)}else{src=3+j;j++;ln(9)}await move(src,row2,k,1);k++}hi([]);sv([]);ln(11);o('[1, 2, 3, 6, 7, 8]')}},
{t:'Швидке сортування та сортування злиттям працюють значно швидше за бульбашку, вибір і вставки, коли список великий. Тому в самому Python метод sort теж використовує швидкий алгоритм.',a:async()=>{hi([])}}
]);

sc('Двійковий пошук',[
{t:'Двійковий пошук працює лише у впорядкованому списку, зате дуже швидко. Щоразу ми дивимось на середній елемент і відкидаємо половину списку, де шуканого числа бути не може. Шукаємо дванадцять.',a:async()=>{reset('a',true);row1.classList.add('narrow');code(['a = [2, 5, 8, 12, 15]','x = 12','low = 0','high = len(a) - 1','while low <= high:','    mid = (low + high) // 2','    if a[mid] == x:','        print(mid)','        break','    elif a[mid] < x:','        low = mid + 1','    else:','        high = mid - 1']);ln(0);await build(['2','5','8','12','15'],250);ln(3);sv(['low = 0','high = 4'])}},
{k:1,t:'Беремо середній індекс mid — це ціла частина від ділення суми low і high на два. Для нашого списку mid дорівнює двом, там число вісім. Вісім менше за дванадцять, так що усе зліва відкидаємо: low стає три.',t2:'Середній елемент — вісім. Він менший за шуканий, тому ліва частина відкидається.',a:async()=>{ln(5);hi([2]);at(2,'mid = 2');sv(['low = 0','high = 4','mid = 2']);await sleep(1500);ln(9);await sleep(800);ln(10);dim([3,4]);hi([]);at();sv(['low = 3','high = 4'])}},
{k:1,t:'Другий крок. Тепер low дорівнює три, а high чотири, mid дорівнює три. Там стоїть дванадцять — це те, що шукали. Виводимо індекс і виходимо з циклу командою break.',t2:'Дванадцять знайдено в клітці з індексом три.',a:async()=>{ln(5);hi([3]);at(3,'mid = 3');sv(['low = 3','high = 4','mid = 3']);await sleep(1500);ln(6);await sleep(700);ln(7);o('3');ln(8)}}
]);

function tk(o){const e=$('#task');e.hidden=!o;if(!o){e.innerHTML='';return}const L={c:'Контекст',i:'Вхідні дані',z:'Завдання',r:'Очікуваний результат'};e.innerHTML='<b>'+esc(o.t)+'</b>'+Object.keys(L).filter(k=>o[k]).map(k=>'<div><u>'+L[k]+':</u> '+esc(o[k])+'</div>').join('')}

const T1={t:'Задача 1. «Еко-патруль»',c:'Датчик щогодини фіксував температуру повітря протягом доби. Потрібно виділити показники вище нуля (відлига).',i:'temps = [-2, 3, 0, 5, -1, 4, 7, -3]',z:'створити список positive_temps лише з додатних чисел і порахувати середню температуру для них',r:'positive_temps = [3, 5, 4, 7], середня температура = 4.75'};
const T2={t:'Задача 2. «Детектор спаму»',c:'У списку слова з чату. Потрібно знайти заборонені слова й винести їх в окремий список для модератора.',i:'messages = ["привіт", "купи", "акція", "як справи", "знижка", "урок"]',z:'створити список spam_list зі слів «купи», «акція», «знижка» (підказка: оператор in)',r:'spam_list = ["купи", "акція", "знижка"]'};
const T3={t:'Задача 3. «Кіберспорт: Топ-3»',c:'Результати турніру з Minecraft. Потрібно швидко визначити трійку лідерів.',i:'scores = [120, 450, 23, 100, 560, 320, 410]',z:'відсортувати за спаданням, створити top_players з перших трьох елементів і вивести привітання',r:'top_players = [560, 450, 410] і три привітання'};
const T4={t:'Задача 4. «Магічне перетворення»',c:'Список цін у гривнях. Акція: усе дорожче за 500 грн коштує 100 грн.',i:'prices = [150, 600, 45, 1200, 300, 750]',z:'створити new_prices: якщо ціна > 500, замінити на 100, інакше залишити без змін',r:'new_prices = [150, 100, 45, 100, 300, 100]'};

sc('Задача 1. Еко-патруль',[
{t:'Практикум. Кожну задачу розбираємо за одним планом: умова, що потрібно отримати, спроба розв’язати самостійно, розв’язок крок за кроком і перевірка. Задача перша — «Еко-патруль». Датчик щогодини фіксував температуру повітря протягом доби. Потрібно виділити показники вище нуля.',a:async()=>{reset('temps',true);row1.classList.add('tight');row2.classList.add('tight');$('#code').innerHTML='';tkp(T1,'c')}},
{t:'Вхідні дані — список temps із восьми чисел. Є від’ємні значення, є нуль, є додатні.',a:async()=>{tkp(T1,'ci');code(['temps = [-2, 3, 0, 5, -1, 4, 7, -3]']);ln(0);await build(['-2','3','0','5','-1','4','7','-3'],250)}},
{t:'Завдання. Створити новий список positive_temps, до якого потраплять лише додатні числа. А ще порахувати середню температуру тільки для цих додатних значень.',a:async()=>{tkp(T1,'ciz')}},

{t:'Спробуйте розв’язати задачу самостійно. Натисніть паузу, подумайте, а потім продовжте розбір.',a:async()=>{hi([])}},
{t:'Розв’язок. Спочатку створюємо порожній список positive_temps. У нього збиратимемо додатні значення.',a:async()=>{code(['temps = [-2, 3, 0, 5, -1, 4, 7, -3]','positive_temps = []','for t in temps:','    if t > 0:','        positive_temps.append(t)','print(positive_temps)','average = sum(positive_temps) / len(positive_temps)','print(average)']);ln(1);$('#nm2').textContent='список positive_temps';$('#blk2').hidden=false}},

{t:'Перевірка. У positive_temps чотири значення, жодне з них не від’ємне й не дорівнює нулю. Середнє збігається з очікуваним результатом. Задачу розв’язано.',a:async()=>{tkp(T1,'cizr')}}
]);

{t:'Вхідні дані — список prices із шести цін.',a:async()=>{tkp(T4,'ci');code(['prices = [150, 600, 45, 1200, 300, 750]']);ln(0);await build(['150','600','45','1200','300','750'],250)}},
{t:'Завдання. Створити новий список new_prices. Якщо ціна більша за п’ятсот, вона замінюється на сто. Якщо ціна не більша за п’ятсот, вона залишається незмінною.',a:async()=>{tkp(T4,'ciz')}},
{t:'Що має вийти. Ціни шістсот, тисяча двісті й сімсот п’ятдесят стають сто. Решта — сто п’ятдесят, сорок п’ять і триста — не змінюються.',a:async()=>{tkp(T4,'cizr');hi([1,3,5])}},
{t:'Спробуйте розв’язати задачу самостійно. Натисніть паузу, подумайте, а потім продовжте розбір.',a:async()=>{hi([])}},
{t:'Розв’язок. Створюємо порожній список new_prices і проходимо по всіх цінах. Для кожної ціни перевіряємо умову.',a:async()=>{code(['prices = [150, 600, 45, 1200, 300, 750]','new_prices = []','for p in prices:','    if p > 500:','        new_prices.append(100)','    else:','        new_prices.append(p)','print(new_prices)','new_prices = [100 if p > 500 else p for p in prices]']);ln(1);$('#nm2').textContent='список new_prices';$('#blk2').hidden=false}},
{t:'Якщо ціна більша за п’ятсот, у новий список додаємо сто. В іншому випадку додаємо ту саму ціну без змін.',t2:'Сто п’ятдесят лишається, шістсот стає сто, сорок п’ять лишається, тисяча двісті стає сто, триста лишається, сімсот п’ятдесят стає сто.',a:async()=>{const v=[150,600,45,1200,300,750];for(let k=0;k<6;k++){row=row1;ln(2);hi([k]);at(k,'p');sv(['p = '+v[k]]);await sleep(650);ln(3);await sleep(450);let nv;if(v[k]>500){ln(4);nv=100;at(k,'> 500 → 100')}else{ln(6);nv=v[k];at(k,'без змін')}row=row2;await ins(k,''+nv)}row=row1;at();hi([]);sv([]);ln(7);o('[150, 100, 45, 100, 300, 100]')}},
{t:'Те саме можна записати коротко генератором списку. Спершу вираз для випадку, коли умова істинна. Далі умова, потім вираз після else, і наприкінці цикл.',seg:[['Те саме можна записати коротко генератором списку. Спершу вираз для випадку, коли умова істинна, — сто.','pe'],['Далі умова: ціна більша за п’ятсот.','pc'],['Після else — вираз для хибної умови: ціна без змін.','pe2'],['І наприкінці цикл for по списку цін.','pf']],f:[['[',['вираз1','c1','якщо умова істинна'],['if умова','c3','перевірка'],['else вираз2','c1','якщо хибна'],['for змінна in послідовність','c2','звідки брати'],']']],a:async()=>{ln(8);dim();o('[150, 100, 45, 100, 300, 100]')}}
]);

const T5={t:'Задача 5. «Знижка 20%»',c:'Той самий список цін у гривнях. Нова акція: на товари, дорожчі за 500 грн, діє знижка 20%.',i:'prices = [150, 600, 45, 1200, 300, 750]',z:'оновити ціни в самому списку prices: якщо ціна > 500, застосувати знижку 20% (ціна × 0.8), інакше залишити без змін',r:'prices = [150, 480.0, 45, 960.0, 300, 600.0]'};
sc('Задача 5. Знижка 20%',[
{t:'Задача п’ята схожа на четверту, але умова інша. Список цін той самий. Тепер магазин не ставить фіксовану ціну, а дає знижку двадцять відсотків на товари, дорожчі за п’ятсот гривень. І цього разу новий список не створюємо: ціни оновлюємо прямо в основному списку.',a:async()=>{reset('prices',true);row1.classList.add('tight');$('#code').innerHTML='';tkp(T5,'c')}},
{t:'Вхідні дані — той самий список prices із шести цін.',a:async()=>{tkp(T5,'ci');code(['prices = [150, 600, 45, 1200, 300, 750]']);ln(0);await build(['150','600','45','1200','300','750'],250)}},
{t:'Завдання. Оновити ціни прямо в списку prices. Якщо ціна більша за п’ятсот, до неї застосовується знижка двадцять відсотків. В іншому разі ціна не змінюється. Новий список не створюється.',a:async()=>{tkp(T5,'ciz')}},
{t:'Як порахувати знижку. Знижка двадцять відсотків означає, що клієнт платить вісімдесят відсотків від ціни. Тому нова ціна — це ціна, помножена на нуль цілих вісім десятих.',a:async()=>{sv(['нова ціна = стара ціна × 0.8'])}},
{t:'Що має вийти. У тому самому списку шістсот стає чотириста вісімдесят, тисяча двісті — дев’ятсот шістдесят, а сімсот п’ятдесят — шістсот. Інші ціни не змінюються.',a:async()=>{sv([]);tkp(T5,'cizr');hi([1,3,5])}},
{t:'Спробуйте розв’язати задачу самостійно. Натисніть паузу, подумайте, а потім продовжте розбір.',a:async()=>{hi([])}},
{t:'Розв’язок. Новий список нам не потрібен. Щоб змінити елемент на місці, треба знати його індекс, тому перебираємо індекси цін: цикл for по range від нуля до довжини списку.',a:async()=>{code(['prices = [150, 600, 45, 1200, 300, 750]','for i in range(len(prices)):','    if prices[i] > 500:','        prices[i] = prices[i] * 0.8','print(prices)']);ln(1)}},
{t:'Для кожного індексу i перевіряємо ціну prices[i]. Якщо вона більша за п’ятсот, записуємо на те саме місце ціну, помножену на нуль вісім.',t2:'Сто п’ятдесят лишається. Шістсот на нуль вісім — чотириста вісімдесят. Сорок п’ять лишається. Тисяча двісті стає дев’ятсот шістдесят. Триста лишається. Сімсот п’ятдесят стає шістсот.',a:async()=>{const v=[150,600,45,1200,300,750];for(let k=0;k<6;k++){ln(1);hi([k]);at(k,'i = '+k);sv(['prices['+k+'] = '+v[k]]);await sleep(650);ln(2);await sleep(450);if(v[k]>500){ln(3);const nv=(v[k]*0.8).toFixed(1);sv(['prices['+k+'] = '+v[k]+' × 0.8 = '+nv]);at(k,'знижка 20%');await sleep(800);await rep(k,nv)}else{at(k,'без змін');await sleep(400)}}at();hi([]);sv([]);ln(4);o('[150, 480.0, 45, 960.0, 300, 600.0]')}},
{t:'Числа з крапкою, наприклад 480.0, — це дробові числа. Множення на 0.8 у Python завжди дає дробове число, навіть якщо після крапки нуль. Це нормально. Головне, що ціни змінилися саме в тому самому списку.',a:async()=>{ln(4)}},
{t:'Практикум завершено. Спробуйте змінити вхідні дані й умови у кожній задачі та перевірити, як зміниться результат.',a:async()=>{hi([])}}
]);
LS[5]={S,titles,starts};

function speak(t){sub.textContent=t;return new Promise(res=>{
 if(muted||!('speechSynthesis' in window))return setTimeout(res,Math.max(2500,t.length*70));
 const u=new SpeechSynthesisUtterance(t),t0=Date.now(),est=Math.max(2000,t.length*70);
 u.lang='uk-UA';u.rate=.92;if(voice)u.voice=voice;
 const fin=()=>{const el=Date.now()-t0;setTimeout(res,el<500?est-el:0)};
 u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})}
const TWO=/\b(ins|del|move|reorder|dim)\(|\bat\([^)]|\bhi\(\[[^\]]/;
async function play(s,my){
 document.querySelectorAll('#nav button').forEach((b,k)=>b.classList.toggle('on',k===s.si));
 const src=s.a.toString(),m=src.match(/ln\((\d+)\)/);
 if(m&&TWO.test(src)&&!/reset\(/.test(src)&&titles[s.si]!=='Підсумок'){
  if(acted===pos){await speak(s.t);return}
  const cd=$('#code');cd.classList.add('exp');if(!s.k){at();hi([]);dim();sv([]);fm(0)}if(s.p)s.p();if(s.f)fm(s.f);ln(+m[1]);if(s.seg){for(const [tx,c] of s.seg){if(c)cd.classList.add('s-'+c);await speak(tx);if(my!==token)break}}else await speak(s.t);cd.classList.remove('exp');[...cd.classList].filter(x=>x.startsWith('s-')).forEach(x=>cd.classList.remove(x));
  if(my!==token)return;
  acted=pos;if(s.f)fm(0);const sp2=s.t2?speak(s.t2):null;
  try{await s.a()}catch(e){if(e!=='abort')console.error(e)}
  if(sp2)await sp2;return}
 const sp=speak(s.t);
 if(acted!==pos){acted=pos;try{await s.a()}catch(e){if(e!=='abort')console.error(e)}}
 await sp}
function upd(){$('#bp').textContent=playing?'⏸ Пауза':(pos>=S.length?'↻ Спочатку':'▶ Продовжити')}
async function run(){
 if(pos>=S.length){pos=0;acted=-1}
 const my=++token;playing=true;upd();
 try{while(pos<S.length&&my===token){await play(S[pos],my);if(my!==token)return;pos++;await sleep(500)}}catch(e){if(e!=='abort')console.error(e)}
 if(my===token){playing=false;upd();if(pos>=S.length)endMenu()}}
function pause(){token++;playing=false;speechSynthesis.cancel();upd()}
function go(i){i=Math.max(0,Math.min(titles.length-1,i));token++;gen++;speechSynthesis.cancel();pos=starts[i];acted=-1;setTimeout(run,150)}
const cur=()=>S[Math.min(pos,S.length-1)].si;
function load(i){li=i;({S,titles,starts}=LS[i]);$('#nav').innerHTML='';titles.forEach((t,k)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>go(k);$('#nav').append(b)});$('h1').textContent='Списки в Python — '+LBL[i];pos=0;acted=-1;gen++;if('speechSynthesis' in window)speechSynthesis.cancel();reset('',false);$('#code').innerHTML='';sub.textContent='';upd()}
$('#bp').onclick=()=>playing?pause():run();
$('#bnext').onclick=()=>go(cur()+1);
$('#bprev').onclick=()=>go(cur()-1);
$('#brep').onclick=()=>go(cur());
$('#bfull').onclick=()=>go(0);
$('#bm').onclick=()=>{muted=!muted;$('#bm').textContent=muted?'🔇 Без звуку':'🔊 Озвучка';if(muted)speechSynthesis.cancel()};
const show=(id,v)=>{$(id).style.display=v?'flex':'none'};
function toMenu(){token++;gen++;if('speechSynthesis' in window)speechSynthesis.cancel();playing=false;load(0);show('#end',0);show('#start',1)}
function begin(i){token++;load(i);show('#start',0);show('#end',0);run()}
$('#bend').onclick=()=>{const was=playing;pause();const e=$('#eb');e.innerHTML='';$('#eh').textContent='Справді завершити урок?';const add=(t,f)=>{const b=document.createElement('button');b.className='big';b.textContent=t;b.onclick=f;e.append(b)};add('Так, завершити',toMenu);add('Ні, продовжити',()=>{show('#end',0);if(was)run()});show('#end',1)};
function endMenu(){const e=$('#eb');e.innerHTML='';$('#eh').textContent=LBL[li]+' завершено';const add=(t,f,d)=>{const b=document.createElement('button');b.className='big';b.textContent=t;b.disabled=!!d;b.onclick=f;e.append(b)};if(li>0)add('← Попередній урок',()=>begin(li-1));add('↻ Повторити цей урок',()=>begin(li));add('✔ Завершити урок',toMenu);const last=li>=LS.length-1;add(last?'Наступний урок (скоро)':'Наступний урок →',()=>begin(li+1),last);show('#end',1)}
const NAMES=['Урок 1. Основи списків','Урок 2. Продовження','Урок 3. Алгоритми та генератори','Урок 4. Типові задачі та рядки','⭐ Урок для допитливих','Урок 5. Практикум'];
const LBL=['Урок 1','Урок 2','Урок 3','Урок 4','Урок для допитливих ⭐','Практикум'];
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.className='big';b.textContent=i<LS.length?'▶ '+n:n+' (скоро)';b.disabled=i>=LS.length;b.onclick=()=>begin(i);$('#eb0').append(b)});
load(0);
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang==='uk-UA')||v.find(x=>x.lang.toLowerCase().startsWith('uk'))||null;$('#warn').hidden=!!voice||!v.length}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pick;pick()}else $('#warn').hidden=false;
</script>
